name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # kompilacja + testy + jar + javadoc
      - run: mvn -B -ntp verify

      - uses: actions/upload-artifact@v7
        with:
          name: jar
          path: target/text-transformer-*.jar

      - uses: actions/upload-artifact@v7
        with:
          name: javadoc
          path: target/site/apidocs
